<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="agenda.css">
    <title>Agentamento</title>
</head>
<body>
    <section id="agendar">
        <form action="">
            <div>
                <label for="aula">Aula: </label>
                <select name="aula" id="aula">
                    <option value="1">1° Aula</option>
                    <option value="2">2° Aula</option>
                    <option value="3">3° Aula</option>
                    <option value="4">4° Aula</option>
                    <option value="5">5° Aula</option>
                    <option value="6">6° Aula</option>
                </select>
            </div>
            <button id="botao-agendar">AGENDAR</button>
        </form>
    </section>
    <hr>
    <section id="agendamentos">
        <div class="agendamento">
            <p>Data: 22/06</p>
            <p>4° Aula</p>
            <p>Status: Finalizado</p>
        </div>
    </section>


    <section id="menu-de-seleção">
        <p><i class="fa-solid fa-calendar"></i></p>
        <a href="index.html"><i class="fa-solid fa-house"></i></a>
        <a href="audiobook.html"><i class="fa-solid fa-circle-play"></i></a>
    </section>

    <script>
        const campoAula = document.getElementById("aula");
        const botaoAgendar = document.getElementById("botao-agendar");
        const agendamentos = document.getElementById("agendamentos")

        botaoAgendar.addEventListener("click",() => {
            event.preventDefault();

            const div = document.createElement('div');
            div.classList.add("agendamento");
            const p1 = document.createElement("p");
            const p2 = document.createElement("p");
            const p3 = document.createElement("p");

            p1.innerHTML = "Data: 10/07"
            p2.innerHTML = `${campoAula.value}° aula`
            p3.innerHTML = "Status: Ativo";

            div.appendChild(p1);
            div.appendChild(p2);
            div.appendChild(p3);

            agendamentos.prepend(div);
        })
    </script>
</body>
</html>
